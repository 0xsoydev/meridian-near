[package]
name = "meridian-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.8.1"
near-sdk = { version = "5.30.1", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
strip = true
